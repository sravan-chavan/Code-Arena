# CodeArena local development stack
# Judge0 is intentionally disabled until an official local setup is decided.
# Official UI is apps/frontend, reached only through Nginx :8080.

name: codearena

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: codearena-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - codearena
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: codearena-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks:
      - codearena
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: codearena-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_INTERNAL_PORT:-4000}
      CODEARENA_SERVICE_NAME: api
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_MIN: ${DB_POOL_MIN:-0}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-10000}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-2000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required. Copy JWT_SECRET from .env.example into .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: "/"
      # Do not consume the execution *request* queue (Worker owns that).
      # server.js still consumes codearena.execution.results so the UI can poll.
      RABBITMQ_CONSUMER_ENABLED: "false"
      WS_ENABLED: ${WS_ENABLED:-true}
      WS_PATH: ${WS_PATH:-/ws}
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-500}
      WS_MAX_CONNECTIONS_PER_USER: ${WS_MAX_CONNECTIONS_PER_USER:-4}
      WS_MAX_SUBSCRIPTIONS_PER_CONNECTION: ${WS_MAX_SUBSCRIPTIONS_PER_CONNECTION:-8}
      WS_AUTH_TIMEOUT_MS: ${WS_AUTH_TIMEOUT_MS:-5000}
      WS_HEARTBEAT_INTERVAL_MS: ${WS_HEARTBEAT_INTERVAL_MS:-25000}
      WS_RANKING_SNAPSHOT_MAX: ${WS_RANKING_SNAPSHOT_MAX:-200}
      WS_CONTEST_WATCH_INTERVAL_MS: ${WS_CONTEST_WATCH_INTERVAL_MS:-5000}
      WS_CONTEST_ENDING_LEAD_SECONDS: ${WS_CONTEST_ENDING_LEAD_SECONDS:-60}
    ports:
      - "${API_PORT:-4000}:${API_INTERNAL_PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - codearena
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: codearena-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${WORKER_INTERNAL_PORT:-4001}
      CODEARENA_SERVICE_NAME: worker
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: "/"
      RABBITMQ_CONSUMER_ENABLED: "true"
      RABBITMQ_RECONNECT_ENABLED: "true"
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-1}
      JUDGE0_URL: ${JUDGE0_URL:-http://host.docker.internal:2358}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
      JUDGE0_POLL_INTERVAL_MS: ${JUDGE0_POLL_INTERVAL_MS:-1000}
      JUDGE0_MAX_POLL_ATTEMPTS: ${JUDGE0_MAX_POLL_ATTEMPTS:-30}
      JUDGE0_REQUEST_TIMEOUT_MS: ${JUDGE0_REQUEST_TIMEOUT_MS:-10000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WORKER_PORT:-4001}:${WORKER_INTERNAL_PORT:-4001}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - codearena
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  postgres:
    image: postgres:16-alpine
    container_name: codearena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - codearena_postgres_data:/var/lib/postgresql/data
    networks:
      - codearena
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: codearena-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - codearena_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - codearena
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Judge0 is external for M7. Do not enable this service until an official
  # in-compose Judge0 setup is explicitly decided. The Worker talks to Judge0
  # via JUDGE0_URL (default: http://host.docker.internal:2358).
  # judge0:
  #   image: <official-judge0-image>
  #   container_name: codearena-judge0
  #   profiles: ["judge0"]
  #   networks:
  #     - codearena

networks:
  codearena:
    name: codearena-network
    driver: bridge

volumes:
  codearena_postgres_data:
    name: codearena_postgres_data
  codearena_rabbitmq_data:
    name: codearena_rabbitmq_data
