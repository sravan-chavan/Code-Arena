worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream codearena_api {
    server api:4000;
  }

  upstream codearena_frontend {
    server frontend:3000;
  }

  server {
    listen 80;
    server_name _;

    # Stack-level health for Compose / make docker-health-codearena
    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"nginx"}';
    }

    # API: /api/* -> Express (strip /api prefix)
    # Browser: /api/auth/login  ->  Express: /auth/login
    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://codearena_api/;
    }

    # WebSocket gateway on the API process. HTTP /api/* is unchanged.
    location /ws {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_pass http://codearena_api;
    }

    # Unified Next.js frontend: /, /admin/*, /client/*
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://codearena_frontend;
    }
  }
}
