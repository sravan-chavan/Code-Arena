worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  upstream codearena_api {
    server api:4000;
  }

  upstream codearena_admin {
    server admin:3000;
  }

  upstream codearena_client {
    server client:3000;
  }

  server {
    listen 80;
    server_name _;

    # Stack-level health for Compose / make docker-health-codearena
    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"nginx"}';
    }

    # API: /api/* -> Express (strip /api prefix)
    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://codearena_api/;
    }

    # Admin Next.js (basePath /admin)
    location /admin {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://codearena_admin;
    }

    # Participant client Next.js (basePath /client)
    location /client {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://codearena_client;
    }

    # Prepared for future WebSocket traffic (not implemented in Milestone 0)
    location /ws {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://codearena_api;
    }

    location = / {
      default_type text/plain;
      return 200 'CodeArena local entry (nginx)\nUse /admin /client /api/health\n';
    }
  }
}
