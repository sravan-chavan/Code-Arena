<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="p1grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="p1grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="p1glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="p1bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#151b2e"/>
      <stop offset="100%" stop-color="#090c14"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" rx="28" fill="url(#p1bg)"/>
  <rect width="120" height="120" rx="28" fill="none" stroke="#223049" stroke-width="1"/>

  <!-- outer hexagon ring, subtle -->
  <polygon points="60,20 90,37 90,73 60,90 30,73 30,37"
           fill="none" stroke="#2b3b58" stroke-width="1.5"/>

  <!-- inner glowing hexagon (arena) -->
  <polygon points="60,28 82,41 82,69 60,82 38,69 38,41"
           fill="none" stroke="url(#p1grad)" stroke-width="2.5" filter="url(#p1glow)"/>

  <!-- code chevrons, layered for depth -->
  <path d="M52 46 L42 60 L52 74" fill="none" stroke="url(#p1grad2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M50 44 L40 60 L50 76" fill="none" stroke="url(#p1grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#p1glow)"/>

  <path d="M68 46 L78 60 L68 74" fill="none" stroke="url(#p1grad2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M70 44 L80 60 L70 76" fill="none" stroke="url(#p1grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#p1glow)"/>
</svg>
